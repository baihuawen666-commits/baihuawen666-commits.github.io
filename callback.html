<!DOCTYPE html>
<!--
  部署位置：GitHub 公开仓库 baihuawen666-commits/baihuawen666-commits.github.io
           根目录 callback.html（网页端编辑替换同名文件）
  作用（企微 SSO Debug 两跳链路）：
    跳 1：企微扫码确认后，浏览器带 code/state 回跳到本页（无 debug_result_id），
          本页 1 秒后把完整 query 原样转发给 identity 的
          /userpool/<uid>/login/generic_wecom/callback，由 identity 完成
          code 换 token、拉用户信息；
    跳 2：identity 处理完后带 debug_result_id 再 302 回本页，本页 1 秒后
          自动跳到 identity 调试结果页查看成功/失败（结果 TTL 仅 60 秒，
          两跳均为自动跳转，人工只需扫码）。
  为什么需要跳 1：私有化 identity 地址无法通过企微"授权回调域"的域名归属
          校验，企微后台只能配 github.io；identity 服务端只认
          redirect_relay_uri 参数指定的中继地址（且必须在 client 白名单内），
          静态页必须自行把 code/state 接力回 identity。
  注意：IDENTITY_BASE 含 179 私有化测试环境地址，该仓库为 public，
       知悉内网测试地址会随仓库公开；测试结束后可还原此文件。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>企微授权回调</title>
</head>
<body>
  <h2>授权回调</h2>
  <p>code：<code id="code"></code></p>
  <p>state：<code id="state"></code></p>
  <p id="jump"></p>
  <script>
    var p = new URLSearchParams(location.search);
    document.getElementById('code').textContent = p.get('code') || '(没有拿到 code)';
    document.getElementById('state').textContent = p.get('state') || '(无)';

    // 179 私有化测试环境固定前缀（仅测试环境，勿挪作他用）
    var IDENTITY_BASE = 'https://14.103.230.169:32671/userpool/36f958e2-7c51-44a7-b25e-8cf1bd29b40c';
    var RESULT_BASE = IDENTITY_BASE + '/login/sso_debug/results';
    var RELAY_TARGET = IDENTITY_BASE + '/login/generic_wecom/callback';

    var resultId = p.get('debug_result_id');
    var code = p.get('code');
    var state = p.get('state');

    if (resultId) {
      // 跳 2：identity 已完成全部 SSO Debug 阶段，带最终结果 ID 回来
      var target = RESULT_BASE + '?debug_result_id=' + encodeURIComponent(resultId);
      document.getElementById('jump').innerHTML =
        '检测到 SSO 调试结果，1 秒后自动打开结果页；如未跳转请' +
        '<a href="' + target + '">点这里手动打开</a>';
      setTimeout(function () { location.replace(target); }, 1000);
    } else if (code && state) {
      // 跳 1：企微回跳的 code/state 原样转发回 identity（query 整串透传，不增删参数）
      var relay = RELAY_TARGET + location.search;
      document.getElementById('jump').innerHTML =
        '检测到企微授权 code，1 秒后自动转发到 identity 回调；如未跳转请' +
        '<a href="' + relay + '">点这里手动转发</a>';
      setTimeout(function () { location.replace(relay); }, 1000);
    }
  </script>
</body>
</html>
